name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Match `engines.node` in package.json. Bump together when the
          # floor moves.
          node-version: "22.19"
          cache: npm

      # `--ignore-scripts` skips the openclaw devDependency's
      # `postinstall-bundled-plugins.mjs` hook, which pulls ~60 bundled
      # channel-plugin packages we don't need for typecheck/lint/test.
      - run: npm ci --ignore-scripts

      - run: npm run lint

      - run: npm run build

      - run: npm test
