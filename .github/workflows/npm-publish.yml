name: Publish to npm

on:
  push:
    tags:
      - "*"

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Match `engines.node` in package.json. Bump together when the
          # floor moves.
          node-version: "22.14"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Resolve publish mode and verify version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          RAW_VERSION="${TAG#v}"
          NPM_TAG="latest"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ "$RAW_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag version and package version are not synchronized."
            echo "tag: ${TAG}"
            echo "expected package.json version: ${RAW_VERSION}"
            echo "actual package.json version: ${PACKAGE_VERSION}"
            exit 1
          fi

          if [[ "$RAW_VERSION" =~ -beta(\.|$) ]]; then
            NPM_TAG="beta"
          fi

          echo "Version check passed: ${TAG} -> ${PACKAGE_VERSION} (npm tag: ${NPM_TAG})"
          echo "npm_tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"

      - run: npm run lint

      - run: npm run build

      - run: npm test

      - name: Publish package to npm
        run: |
          # Force trusted publishing path: remove any legacy token auth context
          # so OIDC is the only auth source.
          if [[ -n "${NPM_CONFIG_USERCONFIG:-}" && -f "${NPM_CONFIG_USERCONFIG}" ]]; then
            rm -f "${NPM_CONFIG_USERCONFIG}"
          fi
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN

          if [[ "${{ steps.release.outputs.npm_tag }}" == "beta" ]]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
